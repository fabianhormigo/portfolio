<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel MCP · mcp-hub</title>
<style>
:root{--azul:#13305C;--azul2:#2F6DB8;--verde:#17784D;--verde-c:#45C489;--tinta:#111;--pizarra:#4A5260;
--papel:#F4F4F1;--linea:#D9DCE1;--aviso:#B4541A;--blanco:#fff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--papel);color:var(--tinta);font-family:system-ui,Arial,sans-serif}
header{height:56px;background:var(--azul);color:#fff;display:flex;align-items:center;gap:14px;padding:0 16px}
header img{height:28px;filter:brightness(0) invert(1)}
header h1{font-size:16px;margin:0;font-weight:700;white-space:nowrap}
.pestanas{display:flex;gap:2px;background:#0B2142;border-radius:8px;padding:3px;margin-left:8px}
.pestanas button{font:inherit;font-size:13px;font-weight:600;border:0;background:transparent;color:#C9D3E3;padding:6px 14px;border-radius:6px;cursor:pointer}
.pestanas button.on{background:#fff;color:var(--azul)}
header .vivo{margin-left:auto;font-size:12px;display:flex;align-items:center;gap:8px;color:#C9D3E3;white-space:nowrap}
.punto{width:9px;height:9px;border-radius:50%;background:var(--verde-c);animation:latido 1.6s infinite}
.punto.caido{background:var(--aviso);animation:none}
@keyframes latido{0%{box-shadow:0 0 0 0 #45C48988}70%{box-shadow:0 0 0 9px #45C48900}100%{box-shadow:0 0 0 0 #45C48900}}
main{display:grid;grid-template-columns:1fr 360px;height:calc(100% - 56px)}
#lienzo{position:relative;overflow:hidden;background:#fff;border-right:1px solid var(--linea);display:flex;flex-direction:column}
#svg{flex:1;width:100%;min-height:0;display:block;cursor:grab}
#linea{height:150px;border-top:1px solid var(--linea);background:#fff;display:none}
body.eje #linea{display:block}
.controles{position:absolute;top:12px;left:12px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 24px)}
.controles button,.controles input{font:inherit;font-size:12px;border:1px solid var(--linea);background:#fff;color:var(--pizarra);padding:6px 10px;border-radius:6px;cursor:pointer}
.controles button.on{background:var(--azul);color:#fff;border-color:var(--azul)}
.controles input{cursor:text;width:150px}
.solo-est,.solo-eje{display:none} body.est .solo-est{display:revert} body.eje .solo-eje{display:revert}
.leyenda{position:absolute;left:12px;bottom:12px;background:#ffffffe6;border:1px solid var(--linea);border-radius:8px;padding:8px 10px;font-size:11px;color:var(--pizarra);display:grid;grid-template-columns:auto auto;gap:3px 14px}
body.eje .leyenda{bottom:162px}
.leyenda i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.leyenda i.cuad{border-radius:2px}
#toast{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none}
.t{background:var(--azul);color:#fff;font-size:12px;padding:7px 11px;border-radius:6px;opacity:.95;animation:fuera 4s forwards}
.t.edit{background:var(--verde)} .t.err{background:var(--aviso)}
@keyframes fuera{0%,80%{opacity:.95}100%{opacity:0}}
aside{overflow-y:auto;padding:14px 16px 40px}
h2{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--verde);margin:18px 0 8px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.kpi{background:#fff;border:1px solid var(--linea);border-radius:8px;padding:7px 9px;min-width:0}
.kpi b{display:block;font-size:17px;color:var(--azul);font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi span{font-size:10.5px;color:var(--pizarra)}
.kpi.alerta b{color:var(--aviso)}
.nota{font-size:12px;color:var(--pizarra);margin:6px 0 0;line-height:1.45}
table{width:100%;border-collapse:collapse;font-size:12px;background:#fff;border:1px solid var(--linea);border-radius:8px;overflow:hidden}
th,td{padding:5px 8px;text-align:left;border-bottom:1px solid var(--linea)} th{color:var(--pizarra);font-weight:600;font-size:11px;background:var(--papel)}
td.n{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer} tr.click:hover td{background:var(--papel)}
.encurso{display:flex;flex-direction:column;gap:4px}
.chip{font-size:12px;background:#17784D14;color:var(--verde);border:1px solid #17784D44;border-radius:6px;padding:5px 8px}
.vacio{font-size:12px;color:#8a919c}
ol.feed{list-style:none;margin:0;padding:0;font-size:12px}
ol.feed li{display:grid;grid-template-columns:54px 1fr auto;gap:6px;padding:5px 0;border-bottom:1px solid var(--linea);cursor:pointer}
ol.feed li:hover{background:var(--papel)}
.hora{color:#8a919c;font-variant-numeric:tabular-nums} .ms{color:var(--pizarra);font-variant-numeric:tabular-nums}
.fase-error .nom{color:var(--aviso);font-weight:600} .fase-inicio .nom{color:var(--verde)}
#detalle{background:#fff;border:1px solid var(--linea);border-radius:8px;padding:10px 12px;font-size:12.5px}
#detalle h3{margin:0 0 2px;font-size:14px;color:var(--azul);word-break:break-all}
#detalle .tipo{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--pizarra)}
#detalle dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:8px 0 0}
#detalle dt{color:var(--pizarra)} #detalle dd{margin:0;font-variant-numeric:tabular-nums}
.vecinos{margin-top:8px;display:flex;flex-wrap:wrap;gap:4px}
.vecinos span{font-size:11px;background:var(--papel);border-radius:4px;padding:2px 6px;cursor:pointer}
text.lbl{font-size:10.5px;fill:var(--tinta);pointer-events:none;paint-order:stroke;stroke:#fff;stroke-width:3px}
.arista{stroke:#C9CED6;stroke-width:1} .arista.infra{stroke:#E6E8EC;stroke-dasharray:2 3}
.arista.viva{stroke:var(--verde);stroke-width:2.4;stroke-dasharray:none}
.nodo .base{stroke:#fff;stroke-width:1.5}
.anillo-art{fill:none;stroke:var(--aviso);stroke-width:1.4;stroke-dasharray:3 2}
.anillo-crit{fill:none;stroke:var(--aviso);stroke-width:2.6}
body.eje .anillo-art,body.eje .anillo-crit{display:none}
.pulso{fill:none;stroke:var(--verde);stroke-width:3;opacity:0}
.nodo.activo .pulso{animation:onda 1.1s infinite}
@keyframes onda{0%{opacity:.9;r:var(--r0)}100%{opacity:0;r:var(--r1)}}
.nodo.reciente .base{stroke:var(--verde);stroke-width:4} .nodo.fallo .base{stroke:var(--aviso);stroke-width:4}
.nodo.editado .base{stroke:var(--verde-c);stroke-width:6}
.nodo.atenuado{opacity:.18} .nodo.sel .base{stroke:var(--azul);stroke-width:4}
body.eje .nodo.dormido{opacity:.35}
#linea text{font-size:10.5px;fill:var(--pizarra)} #linea .eje-t line{stroke:var(--linea)} #linea .eje-t path{display:none}
#linea rect.barra{rx:3} #linea .ahora{stroke:var(--verde);stroke-width:1.5;stroke-dasharray:3 3}
@media (max-width:900px){main{grid-template-columns:1fr;grid-template-rows:62vh auto}#lienzo{border-right:0;border-bottom:1px solid var(--linea)}header h1{display:none}}
</style>
</head>
<body class="est">
<header>
  <h1>mcp-hub</h1>
  <div class="pestanas">
    <button data-vista="est" class="on" title="Cómo está construido el MCP">Estructura</button>
    <button data-vista="eje" title="Qué está pasando ahora">Ejecución</button>
  </div>
  <div class="vivo"><span class="punto" id="punto"></span><span id="estadoTxt">conectando…</span></div>
</header>
<main>
  <section id="lienzo">
    <svg id="svg"></svg>
    <svg id="linea"></svg>
    <div class="controles">
      <span class="solo-est"><button data-color="comunidad" class="on">Área</button></span>
      <span class="solo-est"><button data-color="tipo">Tipo</button></span>
      <span class="solo-est"><button data-color="clase">Consulta / Ejecución</button></span>
      <button id="btnInfra" title="Aristas hacia server.py y actividad.py">Infraestructura</button>
      <button id="btnReorg" title="Vuelve a dejar que el grafo se organice">Reorganizar</button>
      <input id="buscar" placeholder="Buscar pieza…">
    </div>
    <div class="leyenda" id="leyenda"></div>
    <div id="toast"></div>
  </section>
  <aside>
    <div class="solo-est">
      <h2>Estructura del grafo</h2>
      <div class="kpis" id="kpisEst"></div>
      <p class="nota" id="notaEst"></p>
      <h2>Áreas</h2>
      <table id="tablaAreas"></table>
    </div>
    <div class="solo-eje">
      <h2>En curso</h2>
      <div class="encurso" id="encurso"><span class="vacio">Nada ejecutándose</span></div>
      <h2>Dinámica · últimos 5 min</h2>
      <div class="kpis" id="kpisDin"></div>
      <p class="nota" id="sinUso"></p>
      <h2>Latencia por herramienta</h2>
      <table id="tablaLat"></table>
    </div>
    <h2>Pieza seleccionada</h2>
    <div id="detalle"><span class="vacio">Pulsa un nodo del grafo</span></div>
    <div class="solo-eje">
      <h2>Actividad</h2>
      <ol class="feed" id="feed"></ol>
    </div>
  </aside>
</main>
<script src="/static/d3.min.js"></script>
<script>
const COL_TIPO = {servidor:"#13305C", herramienta:"#2F6DB8", recurso:"#17784D", prompt:"#4A5260", modulo:"#0B2142", datos:"#9AA3AF", externo:"#B4541A"};
const NOMBRE_TIPO = {servidor:"Servidor", herramienta:"Herramienta", recurso:"Recurso", prompt:"Prompt", modulo:"Módulo", datos:"Datos / fichero", externo:"Externo"};
const COL_CLASE = {consulta:"#2F6DB8", ejecucion:"#B4541A"};
const COMUNIDAD = ["#13305C","#2F6DB8","#17784D","#4A5260","#8FB0E6","#B4541A","#6B4E9B","#0E7C86","#9C6B30","#A33B5B","#5D7A2E"];
const colArea = a => { const i = (G?.metricas.areas || []).indexOf(a); return i < 0 ? "#9AA3AF" : COMUNIDAD[i % COMUNIDAD.length]; };
let G = null, firma = "", vista = "est", modoColor = "comunidad", sel = null, estadoPrev = null, ultimoT = 0, verInfra = false;
let nodoSel, aristaSel, sim, tocadoPorUsuario = false;
const svg = d3.select("#svg"), raiz = svg.append("g");
const capaH = raiz.append("g"), capaA = raiz.append("g"), capaN = raiz.append("g");
const zoom = d3.zoom().scaleExtent([.2, 4]).on("zoom", e => raiz.attr("transform", e.transform));
svg.call(zoom).on("wheel.u mousedown.u", () => tocadoPorUsuario = true);

const fmt = (v, d=3) => v == null ? "—" : (typeof v === "number" ? +v.toFixed(d) : v);
const hora = t => new Date(t*1000).toLocaleTimeString("es-ES", {hour12:false});
const esInfra = id => (G?.metricas.infra || []).includes(id);
const aristaInfra = d => esInfra(d.source.id ?? d.source) || esInfra(d.target.id ?? d.target);
const comunidadDe = id => G.metricas.area[id];
const radio = n => n.tipo === "servidor" ? 14 : n.tipo === "modulo" ? 11 : 7;
const etiqueta = id => (G.nodos.find(x => x.id === id) || {}).etiqueta || id;
const vecinosDe = id => G.aristas.filter(a => a.source === id || a.target === id).map(a => a.source === id ? a.target : a.source);
const lineaHull = d3.line().curve(d3.curveCatmullRomClosed.alpha(.6));
function toast(txt, cls="") { const d = document.createElement("div"); d.className = "t " + cls; d.textContent = txt;
  document.getElementById("toast").prepend(d); setTimeout(() => d.remove(), 4200); }

function color(n) {
  if (vista === "eje") { // en ejecución el color es el uso
    const pn = estadoPrev?.por_nodo || {}, s = pn[n.id], max = Math.max(1, ...Object.values(pn).map(x => x.llamadas));
    if (["herramienta","recurso","prompt"].includes(n.tipo)) return s ? d3.interpolateRgb("#BFD0EA", "#13305C")(Math.sqrt(s.llamadas / max)) : "#E4E7EB";
    return "#C9CED6";
  }
  if (modoColor === "comunidad") return colArea(comunidadDe(n.id));
  if (modoColor === "clase") return n.tipo === "herramienta" ? COL_CLASE[n.clase] : "#C9CED6";
  return COL_TIPO[n.tipo];
}

function leyenda() {
  const L = document.getElementById("leyenda"), forma = `<span><i class="cuad" style="background:#4A5260"></i>Ejecución (escribe/lanza)</span><span><i style="background:#4A5260"></i>Consulta (solo lee)</span>`;
  if (vista === "eje") L.innerHTML = `<span><i style="background:#13305C"></i>Más usada</span><span><i style="background:#E4E7EB"></i>Sin uso</span><span><i style="border:2px solid #17784D;background:#fff"></i>En curso / reciente</span><span><i style="border:2px solid #B4541A;background:#fff"></i>Error</span>`;
  else if (modoColor === "tipo") L.innerHTML = Object.entries(NOMBRE_TIPO).map(([k,v]) => `<span><i style="background:${COL_TIPO[k]}"></i>${v}</span>`).join("") + forma;
  else if (modoColor === "clase") L.innerHTML = `<span><i class="cuad" style="background:${COL_CLASE.ejecucion}"></i>EJECUCIÓN</span><span><i style="background:${COL_CLASE.consulta}"></i>CONSULTA</span><span style="grid-column:1/-1">El resto de piezas en gris</span>`;
  else L.innerHTML = G.metricas.areas.map(a => `<span><i style="background:${colArea(a)}"></i>${a}</span>`).join("") + forma;
}

// Autoorganizado: repulsión + aristas estructurales + atracción al centroide de la comunidad
function fuerzaGrupo(k = .14) {
  let nodos;
  const f = alfa => {
    const cen = new Map();
    for (const n of nodos) { if (esInfra(n.id)) continue; const c = comunidadDe(n.id), s = cen.get(c) || {x:0, y:0, n:0}; s.x += n.x; s.y += n.y; s.n++; cen.set(c, s); }
    for (const n of nodos) { if (esInfra(n.id)) continue; const s = cen.get(comunidadDe(n.id)); if (!s || s.n < 2) continue;
      n.vx += (s.x / s.n - n.x) * k * alfa; n.vy += (s.y / s.n - n.y) * k * alfa; }
  };
  f.initialize = ns => nodos = ns; return f;
}

function dibujarHulls() {
  const grupos = d3.group(sim.nodes().filter(n => !esInfra(n.id)), n => comunidadDe(n.id));
  const datos = vista === "eje" ? [] : [...grupos].filter(([, ns]) => ns.length >= 2).map(([c, ns]) => ({c,
    hull: d3.polygonHull(ns.flatMap(n => { const r = radio(n) + 16; return d3.range(8).map(i => [n.x + r * Math.cos(i * Math.PI / 4), n.y + r * Math.sin(i * Math.PI / 4)]); }))}));
  capaH.selectAll("path").data(datos, d => d.c).join("path").attr("d", d => lineaHull(d.hull))
    .attr("fill", d => colArea(d.c)).attr("fill-opacity", .07)
    .attr("stroke", d => colArea(d.c)).attr("stroke-opacity", .28).attr("stroke-width", 1.2);
}

function encuadrar(animado = true) {
  const ns = sim?.nodes() || []; if (!ns.length) return;
  const W = svg.node().clientWidth, H = svg.node().clientHeight, m = 60;
  const [x0, x1] = d3.extent(ns, n => n.x), [y0, y1] = d3.extent(ns, n => n.y);
  const k = Math.min(1.6, (W - 2 * m) / (x1 - x0 + 1), (H - 2 * m - 40) / (y1 - y0 + 1));
  const t = d3.zoomIdentity.translate(W / 2 - k * (x0 + x1) / 2, (H + 30) / 2 - k * (y0 + y1) / 2).scale(k);
  (animado ? svg.transition().duration(600) : svg).call(zoom.transform, t);
}

function dibujar() {
  const W = svg.node().clientWidth, H = svg.node().clientHeight;
  const pos = new Map((sim?.nodes() || []).map(n => [n.id, n]));
  const nodos = G.nodos.map(n => Object.assign({}, n, pos.has(n.id) ? {x: pos.get(n.id).x, y: pos.get(n.id).y} : {}));
  const aristas = G.aristas.map(a => ({...a}));
  sim?.stop();
  sim = d3.forceSimulation(nodos)
    .force("link", d3.forceLink(aristas).id(d => d.id).distance(l => aristaInfra(l) ? 190 : 55).strength(l => aristaInfra(l) ? .015 : .75))
    .force("charge", d3.forceManyBody().strength(d => esInfra(d.id) ? -900 : -230).distanceMax(420))
    .force("collide", d3.forceCollide().radius(d => radio(d) + 7))
    .force("grupo", fuerzaGrupo())
    .force("x", d3.forceX(W/2).strength(d => esInfra(d.id) ? .35 : .035))
    .force("y", d3.forceY(H/2).strength(d => esInfra(d.id) ? .35 : .045))
    .alphaDecay(.022);
  aristaSel = capaA.selectAll("line").data(aristas, d => d.source.id + ">" + d.target.id)
    .join("line").attr("class", d => "arista" + (aristaInfra(d) ? " infra" : ""));
  nodoSel = capaN.selectAll("g.nodo").data(nodos, d => d.id).join(ent => {
    const g = ent.append("g").attr("class", "nodo");
    g.append("circle").attr("class", "pulso");
    g.append("path").attr("class", "base");
    g.append("text").attr("class", "lbl");
    g.append("title");
    return g;
  });
  nodoSel.call(d3.drag()
      .on("start", (e, d) => { tocadoPorUsuario = true; if (!e.active) sim.alphaTarget(.25).restart(); d.fx = d.x; d.fy = d.y; })
      .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
      .on("end", (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = d.fy = null; }))
    .on("click", (e, d) => { e.stopPropagation(); seleccionar(d.id); });
  svg.on("click", () => seleccionar(null));
  pintar();
  let ticks = 0;
  sim.on("tick", () => {
    if (++ticks % 40 === 0 && !tocadoPorUsuario) encuadrar(false);
    aristaSel.attr("x1", d => d.source.x).attr("y1", d => d.source.y).attr("x2", d => d.target.x).attr("y2", d => d.target.y);
    nodoSel.attr("transform", d => `translate(${d.x},${d.y})`);
    dibujarHulls();
  });
  sim.on("end", () => { if (!tocadoPorUsuario) encuadrar(); });
}

function pintar() {
  nodoSel.each(function(d) {
    const r = radio(d), g = d3.select(this);
    // forma: cuadrado = EJECUCIÓN (escribe/lanza), círculo = el resto
    const forma = d.tipo === "herramienta" && d.clase === "ejecucion" ? d3.symbolSquare : d3.symbolCircle;
    g.select("path.base").attr("d", d3.symbol(forma, Math.PI * r * r * (forma === d3.symbolSquare ? 1.1 : 1))()).attr("fill", color(d));
    g.select("circle.pulso").attr("r", r).style("--r0", r + "px").style("--r1", (r + 22) + "px");
    g.select("text").text(d.etiqueta.length > 30 ? d.etiqueta.slice(0, 29) + "…" : d.etiqueta).attr("x", r + 4).attr("y", 4);
    g.select("title").text(`${NOMBRE_TIPO[d.tipo]}${d.clase && d.tipo === "herramienta" ? " · " + (d.clase === "consulta" ? "CONSULTA" : "EJECUCIÓN") : ""}: ${d.etiqueta}${d.desc ? "\n" + d.desc : ""}`);
  });
  aristaSel.style("display", function(d) { return aristaInfra(d) && !verInfra && !this.classList.contains("viva") ? "none" : null; });
  leyenda();
}

function seleccionar(id) {
  sel = id;
  const vec = new Set(id ? [id, ...vecinosDe(id)] : []);
  nodoSel.classed("sel", d => d.id === id).classed("atenuado", d => id && !vec.has(d.id));
  aristaSel.style("opacity", d => !id || d.source.id === id || d.target.id === id ? 1 : .12);
  detalle();
}

function detalle() {
  const D = document.getElementById("detalle");
  if (!sel) { D.innerHTML = '<span class="vacio">Pulsa un nodo del grafo</span>'; return; }
  const n = G.nodos.find(x => x.id === sel); if (!n) return;
  const s = (estadoPrev?.por_nodo || {})[n.id] || {}, m = G.metricas;
  const cruza = m.acoplamiento.filter(([a, b]) => a === n.id || b === n.id).length;
  const est = `<dt>Área</dt><dd>${comunidadDe(n.id) ?? "infraestructura"}</dd><dt>Conexiones</dt><dd>${m.grado[n.id] ?? 0}</dd>
    <dt>Cruza áreas</dt><dd>${cruza ? cruza + " arista(s) · acoplamiento" : "no"}</dd>${n.fichero ? `<dt>Fichero</dt><dd>${n.fichero}</dd>` : ""}`;
  const eje = `<dt>Llamadas</dt><dd>${s.llamadas ?? 0}</dd><dt>Errores</dt><dd>${s.errores ?? 0}</dd>
    <dt>Tiempo medio</dt><dd>${s.ms_medio != null ? s.ms_medio + " ms" : "—"}</dd><dt>p95</dt><dd>${s.ms_p95 != null ? s.ms_p95 + " ms" : "—"}</dd><dt>Última</dt><dd>${s.ultima ? hora(s.ultima) : "—"}</dd>`;
  D.innerHTML = `<div class="tipo">${NOMBRE_TIPO[n.tipo]}${n.tipo === "herramienta" ? " · " + (n.clase === "consulta" ? "consulta" : "ejecución") : ""}${n.area ? " · área " + n.area : ""}</div>
    <h3>${n.etiqueta}</h3>${n.desc ? `<div class="nota">${n.desc}</div>` : ""}<dl>${vista === "est" ? est : eje}</dl>
    <div class="vecinos">${vecinosDe(n.id).map(v => `<span data-id="${v}">${etiqueta(v)}</span>`).join("")}</div>`;
  D.querySelectorAll(".vecinos span").forEach(x => x.onclick = () => seleccionar(x.dataset.id));
}

function panelEstructura() {
  const m = G.metricas, k = (v, t, al=false) => `<div class="kpi${al ? " alerta" : ""}"><b title="${v}">${v}</b><span>${t}</span></div>`;
  document.getElementById("kpisEst").innerHTML = k(m.piezas, "piezas MCP") + k(m.areas.length, "áreas")
    + k(m.acoplamiento.length, "cruces entre áreas", m.acoplamiento.length > 0)
    + k(m.n_ciclos, "ciclos", m.n_ciclos > 0) + k(m.huerfanos.length, "piezas sueltas", m.huerfanos.length > 0)
    + k(m.nodos + " / " + m.aristas, "nodos / aristas");
  const lista = xs => xs.map(etiqueta).join(", ");
  document.getElementById("notaEst").textContent = [
    m.acoplamiento.length ? `Cruces: ${m.acoplamiento.map(([a, b]) => etiqueta(a) + " → " + etiqueta(b)).join("; ")}.` : "Áreas independientes: quitar una no rompe las demás.",
    m.n_ciclos ? `Ciclos: ${m.ciclos.map(c => c.map(etiqueta).join(" → ")).join("; ")}.` : "Sin dependencias circulares.",
    m.huerfanos.length ? `Sueltas: ${lista(m.huerfanos)}.` : "",
    "server.py y actividad.py tocan todo a propósito (infraestructura)."].join(" ");
  const filas = m.areas.map(a => { const ns = G.nodos.filter(n => n.area === a);
    return `<tr class="click" data-area="${a}"><td><i style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${colArea(a)};margin-right:6px"></i>${a}</td>
      <td class="n">${ns.filter(n => n.tipo === "herramienta" && n.clase === "consulta").length}</td><td class="n">${ns.filter(n => n.tipo === "herramienta" && n.clase === "ejecucion").length}</td>
      <td class="n">${ns.filter(n => n.tipo !== "herramienta").length}</td></tr>`; }).join("");
  const T = document.getElementById("tablaAreas");
  T.innerHTML = `<tr><th>Área</th><th>Consulta</th><th>Ejecución</th><th>Rec./prompts</th></tr>` + filas;
  T.querySelectorAll("tr[data-area]").forEach(tr => tr.onclick = () => {
    const a = tr.dataset.area; nodoSel.classed("atenuado", d => d.area !== a && d.id !== "mod:" + a); });
}

async function cargarGrafo() {
  const g = await (await fetch("/api/grafo")).json();
  if (g.error) { toast("Error al leer el servidor: " + g.error, "err"); return; }
  const f = JSON.stringify([g.nodos.map(n => n.id + n.clase), g.aristas.map(a => a.source + a.target)]);
  if (f === firma) return;
  const primera = !G; G = g; firma = f;
  dibujar(); panelEstructura(); seleccionar(sel);
  if (!primera) toast("Estructura del MCP actualizada", "edit");
}

function marcar(id, cls, ms) { const n = nodoSel?.filter(d => d.id === id); if (!n || n.empty()) return; n.classed(cls, true); setTimeout(() => n.classed(cls, false), ms); }

// ── Línea de tiempo (vista Ejecución): una barra por llamada, de inicio a fin
function lineaTiempo(e) {
  const S = d3.select("#linea"), W = S.node().clientWidth, H = 150, m = {l: 150, r: 14, t: 10, b: 22};
  const ventana = 120, t1 = e.ahora, t0 = t1 - ventana;
  const ll = (e.llamadas || []).filter(c => (c.t1 ?? t1) >= t0);
  const filas = [...new Set(ll.map(c => c.nombre))].slice(-7);
  const x = d3.scaleLinear([t0, t1], [m.l, W - m.r]), y = d3.scaleBand(filas, [m.t, H - m.b]).padding(.25);
  S.selectAll("*").remove();
  S.append("g").attr("class", "eje-t").attr("transform", `translate(0,${H - m.b})`)
    .call(d3.axisBottom(x).ticks(6).tickSize(-(H - m.t - m.b)).tickFormat(t => `-${Math.round(t1 - t)} s`));
  S.append("g").selectAll("text").data(filas).join("text").attr("x", m.l - 8).attr("y", f => y(f) + y.bandwidth() / 2 + 4).attr("text-anchor", "end").text(f => f.length > 22 ? f.slice(0, 21) + "…" : f);
  S.append("g").selectAll("rect").data(ll.filter(c => filas.includes(c.nombre))).join("rect").attr("class", "barra")
    .attr("x", c => x(Math.max(c.t0, t0))).attr("y", c => y(c.nombre)).attr("height", y.bandwidth())
    .attr("width", c => Math.max(3, x(c.t1 ?? t1) - x(Math.max(c.t0, t0))))
    .attr("fill", c => c.fase === "error" ? "#B4541A" : c.fase === "en_curso" ? "#17784D" : "#2F6DB8")
    .attr("opacity", c => c.fase === "en_curso" ? 1 : .85).style("cursor", "pointer").on("click", (ev, c) => seleccionar(c.nodo))
    .append("title").text(c => `${c.nombre} · ${hora(c.t0)} · ${c.fase === "en_curso" ? "en curso" : (c.ms ?? "?") + " ms"}${c.fase === "error" ? " · ERROR" : ""}`);
  S.append("line").attr("class", "ahora").attr("x1", x(t1)).attr("x2", x(t1)).attr("y1", m.t).attr("y2", H - m.b);
  if (!filas.length) S.append("text").attr("x", W / 2).attr("y", H / 2).attr("text-anchor", "middle").text("Sin llamadas en los últimos 2 minutos");
}

async function sondear() {
  let e;
  try { e = await (await fetch("/api/estado")).json(); }
  catch { document.getElementById("punto").classList.add("caido"); document.getElementById("estadoTxt").textContent = "panel desconectado"; return; }
  document.getElementById("punto").classList.remove("caido");
  document.getElementById("estadoTxt").textContent = "en vivo · " + hora(e.ahora);
  if (!G) return;
  // Estructura: si alguien edita el código del MCP, se ilumina y se recalcula
  if (estadoPrev) for (const [f, t] of Object.entries(e.ficheros))
    if (estadoPrev.ficheros[f] && t > estadoPrev.ficheros[f]) {
      toast(`✎ editado: ${f}`, "edit"); G.nodos.filter(n => n.fichero === f).forEach(n => marcar(n.id, "editado", 6000)); cargarGrafo(); }
  const nuevos = e.ultimos.filter(x => x.t > ultimoT).reverse();
  if (e.ultimos.length) ultimoT = Math.max(ultimoT, e.ultimos[0].t);
  estadoPrev = e;
  if (vista !== "eje") return;
  // Solo piezas que existen hoy (el historial puede traer nombres antiguos)
  const existentes = new Set(G.nodos.map(n => n.id));
  e = {...e, por_nodo: Object.fromEntries(Object.entries(e.por_nodo).filter(([k]) => existentes.has(k))),
       ultimos: e.ultimos.filter(x => existentes.has(`${x.tipo}:${x.nombre}`)),
       llamadas: (e.llamadas || []).filter(c => existentes.has(c.nodo))};
  // Ejecución: pulso en lo que corre y en sus módulos, destellos al terminar o fallar
  const activos = new Set(e.en_curso), usados = new Set(Object.keys(e.por_nodo));
  const modsActivos = new Set([...activos].flatMap(a => vecinosDe(a).filter(v => v.startsWith("mod:") && v !== "mod:actividad")));
  nodoSel.classed("activo", d => activos.has(d.id) || modsActivos.has(d.id))
         .classed("dormido", d => ["herramienta","recurso","prompt"].includes(d.tipo) && !usados.has(d.id) && !activos.has(d.id));
  aristaSel.classed("viva", d => (activos.has(d.source.id) && d.target.id !== "mod:actividad") || modsActivos.has(d.source.id))
           .style("display", d => aristaInfra(d) && !verInfra ? "none" : null);
  for (const ev of nuevos) {
    const id = `${ev.tipo}:${ev.nombre}`;
    if (ev.fase === "fin") { marcar(id, "reciente", 2500); vecinosDe(id).filter(v => v.startsWith("mod:")).forEach(v => marcar(v, "reciente", 2500)); }
    if (ev.fase === "error") { marcar(id, "fallo", 5000); toast(`✖ ${ev.nombre}: ${ev.error || ""}`, "err"); }
    if (ev.fase === "inicio") toast(`▶ ${ev.nombre}`);
  }
  document.getElementById("encurso").innerHTML = e.en_curso.length ? e.en_curso.map(x => `<div class="chip">▶ ${x.replace(/^[a-z]+:/, "")}</div>`).join("") : '<span class="vacio">Nada ejecutándose</span>';
  const k = (v, t, al=false) => `<div class="kpi${al ? " alerta" : ""}"><b>${v}</b><span>${t}</span></div>`;
  const tot = Object.values(e.por_nodo).reduce((a, s) => a + s.llamadas, 0), lat = Object.values(e.por_nodo).flatMap(s => s.ms_p95 != null ? [s.ms_p95] : []);
  document.getElementById("kpisDin").innerHTML = k(e.llamadas_5min, "llamadas") + k(e.errores_5min, "errores", e.errores_5min > 0) + k(e.en_curso.length, "en curso")
    + k(tot, "llamadas totales") + k(usados.size + "/" + G.nodos.filter(n => ["herramienta","recurso","prompt"].includes(n.tipo)).length, "piezas usadas")
    + k(lat.length ? Math.max(...lat) + " ms" : "—", "p95 más lento");
  const sinUso = G.nodos.filter(n => n.tipo === "herramienta" && !usados.has(n.id)).map(n => n.etiqueta);
  document.getElementById("sinUso").textContent = sinUso.length ? `Herramientas sin usar nunca (${sinUso.length}): ${sinUso.join(", ")}.` : "Todas las herramientas se han usado.";
  document.getElementById("tablaLat").innerHTML = `<tr><th>Pieza</th><th>Llam.</th><th>Medio</th><th>p95</th><th>Err.</th></tr>` +
    Object.entries(e.por_nodo).sort((a, b) => (b[1].ms_p95 ?? 0) - (a[1].ms_p95 ?? 0)).map(([id, s]) =>
      `<tr class="click" data-id="${id}"><td>${id.replace(/^[a-z]+:/, "")}</td><td class="n">${s.llamadas}</td><td class="n">${s.ms_medio ?? "—"}</td><td class="n">${s.ms_p95 ?? "—"}</td><td class="n">${s.errores || ""}</td></tr>`).join("");
  document.querySelectorAll("#tablaLat tr[data-id]").forEach(tr => tr.onclick = () => seleccionar(tr.dataset.id));
  const feed = document.getElementById("feed");
  feed.innerHTML = e.ultimos.length ? e.ultimos.map(ev => `<li class="fase-${ev.fase}" data-id="${ev.tipo}:${ev.nombre}"><span class="hora">${hora(ev.t)}</span>
     <span class="nom">${ev.fase === "inicio" ? "▶ " : ev.fase === "error" ? "✖ " : "✓ "}${ev.nombre}</span><span class="ms">${ev.ms != null ? ev.ms + " ms" : ""}</span></li>`).join("")
    : '<li class="vacio" style="display:block">Sin eventos todavía</li>';
  feed.querySelectorAll("li[data-id]").forEach(li => li.onclick = () => seleccionar(li.dataset.id));
  pintar(); lineaTiempo(e); if (sel) detalle();
}

function cambiarVista(v) {
  vista = v; document.body.className = v;
  document.querySelectorAll("[data-vista]").forEach(b => b.classList.toggle("on", b.dataset.vista === v));
  nodoSel?.classed("activo dormido reciente fallo", false); aristaSel?.classed("viva", false);
  pintar(); dibujarHulls(); detalle(); if (v === "eje" && estadoPrev) sondear();
  setTimeout(() => { if (!tocadoPorUsuario) encuadrar(); }, 50);
}
document.querySelectorAll("[data-vista]").forEach(b => b.onclick = () => cambiarVista(b.dataset.vista));
document.querySelectorAll("[data-color]").forEach(b => b.onclick = () => {
  modoColor = b.dataset.color; document.querySelectorAll("[data-color]").forEach(x => x.classList.toggle("on", x === b)); pintar(); });
document.getElementById("btnInfra").onclick = ev => { verInfra = !verInfra; ev.target.classList.toggle("on", verInfra); pintar(); };
window.addEventListener("resize", () => { if (!tocadoPorUsuario) encuadrar(false); });
document.getElementById("btnReorg").onclick = () => { sim.nodes().forEach(n => { n.x += (Math.random() - .5) * 200; n.y += (Math.random() - .5) * 200; }); tocadoPorUsuario = false; sim.alpha(1).restart(); };
document.getElementById("buscar").oninput = ev => { const q = ev.target.value.trim().toLowerCase(); nodoSel.classed("atenuado", d => q && !d.etiqueta.toLowerCase().includes(q)); };
window.addEventListener("resize", () => G && dibujar());
cargarGrafo().then(sondear);
setInterval(sondear, 1000);
setInterval(cargarGrafo, 5000);
</script>
